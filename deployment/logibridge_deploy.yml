---
# LogiEdge OTA Deployment Playbook
# Deploys/updates the inference container on a fleet truck edge node.
# Idempotent: running this playbook twice with no source changes must
# report changed=0 on the second run.
#
# Run:
#   ansible-playbook -i inventory.ini deployment/logibridge_deploy.yml

- name: Deploy LogiEdge inference service to truck edge node
  hosts: truck_edge_nodes
  become: true
  vars:
    logibridge_dir: /opt/logibridge
    registry: "localhost:5000"
    image_name: "logibridge-inference"
    image_tag: "latest"
    model_src: "../inference/model.tflite"
    reference_dist_src: "../monitoring/reference_dist.json"

  tasks:

    - name: 1. Ensure /opt/logibridge directory exists
      ansible.builtin.file:
        path: "{{ logibridge_dir }}"
        state: directory
        mode: "0755"

    - name: 2. Copy new model file to /opt/logibridge/model.tflite
      ansible.builtin.copy:
        src: "{{ model_src }}"
        dest: "{{ logibridge_dir }}/model.tflite"
        mode: "0644"

    - name: 3. Copy updated reference_dist.json
      ansible.builtin.copy:
        src: "{{ reference_dist_src }}"
        dest: "{{ logibridge_dir }}/reference_dist.json"
        mode: "0644"

    - name: 4. Stop the running inference container if running
      community.docker.docker_container:
        name: logibridge-inference
        state: stopped
      ignore_errors: true

    - name: 5. Pull updated container image from local Docker registry
      community.docker.docker_image:
        name: "{{ registry }}/{{ image_name }}:{{ image_tag }}"
        source: pull

    - name: 6. Start inference container with environment variables
      community.docker.docker_container:
        name: logibridge-inference
        image: "{{ registry }}/{{ image_name }}:{{ image_tag }}"
        state: started
        restart_policy: unless-stopped
        volumes:
          - "{{ logibridge_dir }}/model.tflite:/app/model.tflite:ro"
          - "{{ logibridge_dir }}/reference_dist.json:/app/reference_dist.json:ro"
        env:
          MODEL_PATH: "/app/model.tflite"
          TRUCK_ID: "{{ inventory_hostname }}"
          BROKER_HOST: "mosquitto"
          BROKER_PORT: "1883"

    - name: 7. Wait 15 seconds and verify container is running
      ansible.builtin.shell: |
        sleep 15
        docker inspect -f '{{ "{{.State.Running}}" }}' logibridge-inference
      register: verify_result
      changed_when: false
      failed_when: "'true' not in verify_result.stdout"
